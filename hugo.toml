# ─────────────────────────────────────────────────────────────────────
#  ARTIST ONE-PAGE TEMPLATE
#
#  Ships with the "Marchaos" demo brand so it runs out of the box and
#  shows what goes where. Replace every value below with your own.
#
#  BILINGUAL: the default language is lunfardo castellano (es-AR); the
#  [languages.en] block near the bottom overrides the prose with american
#  english. Scalar params fall through to a language if it doesn't set
#  them; ARRAYS (quotes.lines, timeline.entries, footer.lines, listen
#  .links) do NOT merge — re-list the whole array for each language.
#  Content: one Markdown file per language, e.g. berlin.es.md / berlin.en.md.
#
#  - Optional sections (listen, timeline, shows) disappear when their
#    entries are removed. Delete the whole block to hide a section.
#  - Prose fields accept Markdown (links, *emphasis*).
#  - Colors live in one block at the top of assets/scss/main.scss.
#  - Fixed UI strings (buttons, "tickets", 404) live in i18n/*.toml.
#
#  Requires Hugo extended.  `hugo server` to preview.
# ─────────────────────────────────────────────────────────────────────

baseURL = "https://www.thedropwasforetold.world/"
title = "Marchaos"   # en spelling; es overrides to "Marcaos" below
enableEmoji = false
buildFuture = true   # future-dated ceremonies are upcoming shows, not drafts
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

defaultContentLanguage = "es"          # lunfardo castellano is the default
defaultContentLanguageInSubdir = false  # es at /, en at /en/

[languages.es]
title = "Marcaos"
label = "lunfardo castellano"
locale = "es_AR"
weight = 1

[languages.en]
label = "american english"
locale = "en_US"
weight = 2

[markup.goldmark.renderer]
unsafe = true   # allow inline HTML in Markdown prose fields

# ═════════════════════════════════════════════════════════════════════
#  DEFAULT LANGUAGE — lunfardo castellano
# ═════════════════════════════════════════════════════════════════════

# ── hero ─────────────────────────────────────────────────────────────
[params.hero]
name    = "Marcaos"
tagline = "el drop estaba escrito."
genre   = "dark progressive house · fondo ancestral y místico"
cue     = "la gente no baila. recibe."
image   = "artist.jpg"   # a file inside assets/ — shared by both languages

# ── about / bio ──────────────────────────────────────────────────────
[params.about]
heading = "el vaso"
body = """
toda la vida le dijeron gitano. una adivina en buenos aires le tiró que iba
a ser el dj internacional de la frecuencia gitana. al toque, el destino se
acomodó. apareció un nombre. se tiró un set. un alma se partió al medio.
"""
whisper = "marcos se quedó atrás. marcaos siguió de largo."

# ── press quotes ─────────────────────────────────────────────────────
[params.quotes]
heading = "el sonido"
texture = "sub-graves profundos · 124–128 bpm · bandoneón filtrado · texturas de viento · fósforos que se prenden · castellano al revés · ruido de cinta · estribillos en tono menor"
lines = [
  '"como el momento antes de la tormenta, pero hecho boliche."',
  '"si borges pinchara en berlín con samples fantasma y el corazón roto."',
  '"bajos tan hondos que podés enterrar secretos adentro."',
]

# ── listen (optional) ────────────────────────────────────────────────
[params.listen]
heading = "escuchá"
[[params.listen.links]]
name = "Spotify"
url  = "#"
[[params.listen.links]]
name = "SoundCloud"
url  = "#"
[[params.listen.links]]
name = "Bandcamp"
url  = "#"

# ── timeline (optional) ──────────────────────────────────────────────
[params.timeline]
heading = "línea de tiempo de la profecía"
[[params.timeline.entries]]
label = "antes"
text  = 'la tía avisaba que "caminaba con tempo."'
[[params.timeline.entries]]
label = "antes"
text  = 'la abuelita: "cuando bailás, escuchás cosas que no están ahí."'
[[params.timeline.entries]]
label = "la niebla"
text  = "se esfumó 3 días en parque centenario. volvió cambiado."
[[params.timeline.entries]]
label = "la tirada"
text  = "la adivina le pone nombre a la frecuencia gitana."
[[params.timeline.entries]]
label = "la partida"
text  = "se tiró un set. marcaos siguió de largo."
[[params.timeline.entries]]
label = "2K25"
text  = "primer disco *Gypsy Nights*. gira mundial *The Drop Was Foretold*."

# ── shows (optional) ─────────────────────────────────────────────────
# One Markdown file per show per language in content/ceremonies/, e.g.
# paris.es.md / paris.en.md (see the samples). Delete them all to hide
# the section. This block only sets the heading.
[params.shows]
heading = "ceremonias"

# ── press / booking ──────────────────────────────────────────────────
[params.press]
heading = "prensa · contrataciones"
body    = "epk: bio, visuales, línea de tiempo de la profecía. el set arranca a oscuras, un fósforo que se prende, y después el bombo."
email   = "ceremonies@thedropwasforetold.world"
whisper = "gracias por confiar en el drop."

# ── social (shared by both languages) ────────────────────────────────
[[params.social]]
name = "@marchaos.wav"
url  = "https://instagram.com/marchaos.wav"
[[params.social]]
name = "@Marchaos"
url  = "https://soundcloud.com/Marchaos"

# ── footer ───────────────────────────────────────────────────────────
[[params.footer.lines]]
text = "marcaos no es una marca. es una señal."
[[params.footer.lines]]
text = "marcos soñaba con la luz. marcaos se quedó en las sombras."
dim  = true

# ═════════════════════════════════════════════════════════════════════
