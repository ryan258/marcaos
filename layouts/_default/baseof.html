<!doctype html>
<html lang="en">
{{ partial "head.html" . }}
<body>
  <div class="void-overlay" aria-hidden="true"></div>
  <div class="blackout-vignette" aria-hidden="true"></div>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ with .Site.Params.footer.lines }}
  <footer>
    {{ range . }}<p{{ if .dim }} class="whisper"{{ end }}>{{ .text | markdownify }}</p>{{ end }}
  </footer>
  {{ end }}
</body>
</html>
