<!doctype html>
<html lang="{{ .Language.Lang }}">
{{ partial "head.html" . }}
<body{{ if and (eq .Kind "page") (eq .Section "ceremonies") }} data-ceremony="{{ .File.ContentBaseName }}"{{ end }}>
  <div class="void-overlay" aria-hidden="true"></div>
  <div class="blackout-vignette" aria-hidden="true"></div>
  <div class="alley-grid" aria-hidden="true"></div>
  <div class="fog" aria-hidden="true"></div>
  <div class="halo" aria-hidden="true"></div>
  <div class="light-bleed" aria-hidden="true"></div>
  <div class="scroll-needle" aria-hidden="true"></div>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <filter id="daguerre">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
    </filter>
  </svg>
  <div class="top-bar">
    <button class="soul-toggle" id="soul-toggle" type="button" aria-pressed="false" aria-label="split soul perspective">
      <span class="soul-glyph" aria-hidden="true">☿</span> <span class="soul-label">marchaos</span>
    </button>
    {{ if gt (len .AllTranslations) 1 }}
    <nav class="langs" aria-label="language">
      {{ range .AllTranslations }}
      <a href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}"{{ if eq .Language.Lang $.Language.Lang }} aria-current="page"{{ end }}>{{ .Language.Label }}</a>
      {{ end }}
    </nav>
    {{ end }}
  </div>
  <p class="ba-clock" data-night="{{ i18n "ba_night" }}" data-day="{{ i18n "ba_day" }}" hidden></p>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ with .Site.Params.footer.lines }}
  <footer>
    <canvas class="smoke" aria-hidden="true"></canvas>
    {{ range . }}<p{{ if .dim }} class="whisper"{{ end }}>{{ .text | markdownify }}</p>{{ end }}
  </footer>
  {{ end }}
</body>
</html>
